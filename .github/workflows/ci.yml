name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: C header (linux, macos)
        if: runner.os != 'Windows'
        working-directory: c
        run: |
          cc --version
          cc -Wall -Wextra -Werror tests/test.c -I. -ldl -o c_aot_test
          ./c_aot_test
          cc -Wall -Wextra -Werror examples/add.c -ldl -o add
          ./add

      - name: C header (windows, mingw gcc)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: c
        run: |
          gcc --version
          gcc -Wall -Wextra -Werror tests/test.c -I. -o c_aot_test.exe
          ./c_aot_test.exe
          gcc -Wall -Wextra -Werror examples/add.c -o add.exe
          ./add.exe

      - name: Rust crate
        working-directory: rust
        run: |
          cargo test --all-targets
          cargo test --doc
          cargo run --example add
