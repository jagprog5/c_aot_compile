name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # the compiler the tests use; empty means the library's default
      C_AOT_TEST_COMPILER: ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu, os: ubuntu-latest, cc: ""}
          - {name: macos, os: macos-latest, cc: ""}
          - {name: windows (mingw gcc), os: windows-latest, cc: gcc}
          - {name: windows (clang), os: windows-latest, cc: clang}
    steps:
      - uses: actions/checkout@v4

      - name: C header (linux, macos)
        if: runner.os != 'Windows'
        working-directory: c
        run: |
          cc --version
          cc -Wall -Wextra -Werror tests/test.c -I. -ldl -o c_aot_test
          ./c_aot_test
          cc -Wall -Wextra -Werror examples/add.c -ldl -o add
          ./add

      - name: C header (windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: c
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cc }} -Wall -Wextra -Werror tests/test.c -I. -o c_aot_test.exe
          ./c_aot_test.exe
          ${{ matrix.cc }} -Wall -Wextra -Werror examples/add.c -o add.exe
          ./add.exe

      - name: Rust crate
        working-directory: rust
        run: |
          cargo test --all-targets
          cargo test --doc
          cargo run --example add
