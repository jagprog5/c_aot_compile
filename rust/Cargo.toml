[package]
name = "c_aot_compile"
version = "0.1.0"
edition = "2021"
description = "Compile C source at runtime with the system C compiler and load it (Linux, macOS, Windows)"
license = "MIT OR Apache-2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Linux only: use a private temp directory instead of memory files (the way every
# other system works). For testing that path.
no_memory_files = []
